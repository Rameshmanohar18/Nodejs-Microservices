version: "3.8"

services:
  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: flipkart-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - flipkart-net

  # Node.js App (3 replicas for load balancing)
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    image: flipkart-clone:${VERSION:-latest}
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
    env_file:
      - ../.env.production
    depends_on:
      - mongodb
      - redis
    networks:
      - flipkart-net
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s

  # MongoDB with Replica Set
  mongodb:
    image: mongo:6
    container_name: flipkart-mongodb
    restart: always
    command: mongod --replSet rs0 --bind_ip_all
    volumes:
      - mongodb_prod_data:/data/db
      - mongodb_prod_config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    networks:
      - flipkart-net
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: flipkart-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    networks:
      - flipkart-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:8.10.0
    container_name: flipkart-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - elasticsearch_prod_data:/usr/share/elasticsearch/data
    networks:
      - flipkart-net
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: flipkart-prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_prod_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - flipkart-net

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: flipkart-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_prod_data:/var/lib/grafana
    networks:
      - flipkart-net

networks:
  flipkart-net:
    driver: overlay
    attachable: true

volumes:
  mongodb_prod_data:
  mongodb_prod_config:
  redis_prod_data:
  elasticsearch_prod_data:
  prometheus_prod_data:
  grafana_prod_data:

